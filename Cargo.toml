[package]
name = "cpa-portal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GitHub login and API key provisioning portal for CPA"

[dependencies]
anyhow = "1"
askama = "0.14"
axum = { version = "0.8", features = ["macros"] }
base64ct = { version = "1", features = ["alloc"] }
chacha20poly1305 = "0.10"
config = "0.15"
getrandom = "0.3"
hex = "0.4"
oauth2 = "5"
nutype = { version = "0.7", features = ["serde"] }
octocrab = "0.51"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = { version = "0.10", features = ["serde"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "time"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
