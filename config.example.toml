[server]
listen = "0.0.0.0:8080"
public_base_url = "https://ai.example.com"
site_name = "CPA Portal"
# Set to false to reject sign-ups from GitHub users without an account; existing users can still sign in.
allow_registration = true

[server.session]
cookie_name = "cpa_portal"
secure = true
ttl_seconds = 2592000

[github]
client_id = ""
client_secret = ""

[cpa]
public_base_url = "https://ai.example.com"
internal_base_url = "http://127.0.0.1:8317"
management_key = ""

[keeper]
internal_base_url = "http://cpa-usage-keeper:8080/usage"
login_password = ""

[admin_api]
token = ""

[database]
url = "sqlite://./data/cpa-portal.db"

[security]
# Generate 32 random bytes and encode them with base64 or base64url.
api_key_encryption_key = ""
api_key_prefix = "sk-ghu-"
